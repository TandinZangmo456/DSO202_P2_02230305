# =============================================================================
# File        : manifests/04-pvc-static.yaml
# Practical   : DSO202 Practical 2
# Purpose     : Request storage. The control plane binds this claim to any
#               Available volume whose class name, capacity and access modes
#               satisfy it - here, the volume from Listing 5.
# Apply with  : kubectl apply -f manifests/04-pvc-static.yaml
# =============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-web-static
  namespace: dso202-practical-02
  labels:
    app: static-writer
    tier: storage-demo
    dso202/practical: "02"
    dso202/managed-by: declarative
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: manual
  resources:
    requests:
      storage: 1Gi

