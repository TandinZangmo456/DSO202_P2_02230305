# =============================================================================
# File        : manifests/03-pv-static.yaml
# Practical   : DSO202 Practical 2
# Purpose     : Describe storage that already exists to the Kubernetes API.
#               No provisioner is involved: the directory is the host directory
#               mounted into worker-node-1 by Listing 1.
# Apply with  : kubectl apply -f manifests/03-pv-static.yaml
# =============================================================================
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-web-static
  labels:
    dso202/practical: "02"
    dso202/managed-by: declarative
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /mnt/dso202-static/pv-web-static
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: dso202/node-index
              operator: In
              values:
                - "1"
