# =============================================================================
# File        : cluster/kind-cluster-fallback.yaml
# Practical   : DSO202 Practical 2
# Purpose     : Same three-node cluster as Listing 1, without the node-name
#               patches. Node objects keep kind's default names.
# Apply with  : kind create cluster --config cluster/kind-cluster-fallback.yaml
# Use only if : Listing 1 fails during cluster creation with an error mentioning
#               nodeRegistration, or kubectl get nodes continues to show the
#               Docker container names after a clean recreation.
# =============================================================================
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: dso202-p2
networking:
  apiServerAddress: "127.0.0.1"
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/16"
nodes:
  - role: control-plane
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "dso202/node-role=worker,dso202/node-index=1"
    extraMounts:
      - hostPath: /home/tandinzangmo/dso202-p2-storage
        containerPath: /mnt/dso202-static
        readOnly: false
        selinuxRelabel: false
        propagation: None
  - role: worker
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "dso202/node-role=worker,dso202/node-index=2"
