# =============================================================================
# File        : cluster/kind-cluster.yaml
# Practical   : DSO202 Practical 2
# Purpose     : Three-node cluster with one host directory mounted into the
#               first worker, so that a statically provisioned PersistentVolume
#               can be backed by storage that outlives the cluster.
# Apply with  : kind create cluster --config cluster/kind-cluster.yaml
# Delete with : kind delete cluster --name dso202-p2
# Requires    : mkdir -p /home/tandinzangmo/dso202-p2-storage   (run BEFORE creating the
#               cluster; kind mounts the directory at creation time)
# =============================================================================
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4

name: dso202-p2

networking:
  apiServerAddress: "127.0.0.1"
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/16"

nodes:
  - role: control-plane
    image: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          name: control-plane

  - role: worker
    image: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          name: worker-node-1
          kubeletExtraArgs:
            node-labels: "dso202/node-role=worker,dso202/node-index=1"
    extraMounts:
      - hostPath: /home/tandinzangmo/dso202-p2-storage
        containerPath: /mnt/dso202-static
        readOnly: false
        selinuxRelabel: false
        propagation: None

  - role: worker
    image: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
    kubeadmConfigPatches:
      - |
        kind: JoinConfiguration
        nodeRegistration:
          name: worker-node-2
          kubeletExtraArgs:
            node-labels: "dso202/node-role=worker,dso202/node-index=2"
